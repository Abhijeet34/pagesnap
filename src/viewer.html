<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="viewer">
  <header>
    <div class="meta">
      <h1></h1>
      <p></p>
    </div>
    <div class="actions">
      <button class="zoom" aria-pressed="false" title="Show at actual size">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
        <span>Fit</span>
      </button>
      <button class="copy" title="Copy (⌘C)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Copy</span>
      </button>
      <button class="share" hidden title="Share">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Share</span>
      </button>
      <div class="split">
        <button class="download" title="Download PNG (⌘S)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Download</span>
        </button>
        <button class="more" popovertarget="formats" aria-label="Choose a format">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="menu" id="formats" popover>
        <button data-format="png"><span>PNG</span><small>Lossless, full resolution</small></button>
        <button data-format="jpeg"><span>JPG</span><small>Smaller file, full resolution</small></button>
      </div>
    </div>
  </header>
  <main class="stage">
    <img alt="">
  </main>
  <dialog class="sheet" aria-labelledby="share-title">
    <div class="sheet-head">
      <span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
      <button class="close" aria-label="Stop sharing and close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <h2 id="share-title">Share link</h2>
    <p class="hint">The image goes straight from this tab to the person who opens the link. Nothing is uploaded, and the link stops working when you close this.</p>
    <div class="link-row">
      <input class="link" readonly aria-label="Share link" spellcheck="false">
      <button class="copy-link"><span>Copy link</span></button>
    </div>
    <p class="share-status" role="status" aria-live="polite"><span class="dot"></span><span class="text"></span><span class="timer"></span></p>
    <div class="request" hidden>
      <p>Ask them for the code on their screen. Send only if it matches.</p>
      <div class="code" aria-label="Confirmation code"></div>
      <div class="request-actions">
        <button class="decline">Decline</button>
        <button class="send primary">Send</button>
      </div>
    </div>
    <div class="bar sending" hidden><div class="fill"></div></div>
    <p class="sent" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Sent. The link no longer works.</span></p>
    <div class="sheet-foot">
      <button class="stop">Stop sharing</button>
    </div>
  </dialog>
  <script src="viewer.js" type="module"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PageSnap</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>PageSnap</h1>
  <ul class="modes">
    <li><button data-mode="full"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2" width="12" height="16" rx="1.5"/><path d="M7 6h6M7 9h6M7 12h6M7 15h4"/></svg><span>Full page</span><kbd>⌥⇧F</kbd></button></li>
    <li><button data-mode="scroll"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2" width="12" height="11" rx="1.5"/><path d="M10 15v3M7.5 16l2.5 2.5 2.5-2.5"/></svg><span>Scrolling capture</span><kbd>⌥⇧S</kbd></button></li>
    <li><button data-mode="visible"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="1.5"/><path d="M2 7.5h16"/></svg><span>Visible area</span><kbd>⌥⇧V</kbd></button></li>
    <li><button data-mode="area"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6V3.5A1.5 1.5 0 0 1 3.5 2H6M14 2h2.5A1.5 1.5 0 0 1 18 3.5V6M18 14v2.5a1.5 1.5 0 0 1-1.5 1.5H14M6 18H3.5A1.5 1.5 0 0 1 2 16.5V14"/></svg><span>Select area</span><kbd>⌥⇧A</kbd></button></li>
    <li><button data-mode="window"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="11" rx="1.5"/><path d="M7 17.5h6M10 14v3.5"/></svg><span>Window or screen</span></button></li>
  </ul>
  <p class="status" role="status" aria-live="polite"></p>
  <script src="popup.js" type="module"></script>
</body>
</html>

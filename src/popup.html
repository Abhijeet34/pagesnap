<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PageSnap</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <ul class="modes" aria-label="Capture">
    <li><button data-mode="full">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      <span>Full page</span><span class="keys"><kbd>⌥</kbd><kbd>⇧</kbd><kbd>F</kbd></span>
    </button></li>
    <li><button data-mode="visible">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/></svg>
      <span>Visible area</span><span class="keys"><kbd>⌥</kbd><kbd>⇧</kbd><kbd>V</kbd></span>
    </button></li>
    <li><button data-mode="area">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      <span>Select area</span><span class="keys"><kbd>⌥</kbd><kbd>⇧</kbd><kbd>A</kbd></span>
    </button></li>
    <li><button data-mode="window">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
      <span>Window or screen</span>
    </button></li>
  </ul>
  <div class="progress" hidden>
    <div class="progress-row"><span class="progress-label"></span><span class="progress-value"></span></div>
    <div class="bar" role="progressbar" aria-label="Capture progress"><div class="fill"></div></div>
  </div>
  <p class="status" role="status" aria-live="polite"></p>
  <script src="popup.js" type="module"></script>
</body>
</html>
